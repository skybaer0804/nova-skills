services:
  memory-db:
    image: mysql:8.0
    container_name: nova-memory-db
    ports:
      - "3377:3306"
    environment:
      MYSQL_ROOT_PASSWORD: nova_root
      MYSQL_DATABASE: agent_memory
      MYSQL_USER: nova
      MYSQL_PASSWORD: nova_pass
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - nova-memory:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "nova", "-pnova_pass"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
volumes:
  nova-memory:
